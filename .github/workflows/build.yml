name: Build Flutter On-Device AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'
        channel: 'stable'

    # Langkah Baru: Membuat struktur folder Android lengkap
    - name: Re-generate Flutter Project Structure
      run: flutter create --platforms=android --project-name=ai_olahraga_app .

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Android APK
      run: flutter build apk --release --target-platform android-arm64

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Olahraga-App
        path: build/app/outputs/flutter-apk/app-release.apk
