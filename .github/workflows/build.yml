name: Build Flutter On-Device AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'
        channel: 'stable'

    # 1. Bersihkan folder android lama
    - name: Clean Old Android Project
      run: rm -rf android

    # 2. Re-generate proyek Android
    - name: Re-generate Flutter Android Project
      run: flutter create --platforms=android --project-name=ai_olahraga_app .

    # 3. Injeksi pubspec.yaml yang valid
    - name: Inject Valid pubspec.yaml
      run: |
        cat << 'EOF' > pubspec.yaml
        name: ai_olahraga_app
        description: "A new Flutter project for On-Device AI."
        publish_to: 'none'
        version: 1.0.0+1

        environment:
          sdk: '>=3.4.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          cupertino_icons: ^1.0.8
          fllama: ^0.0.1
          dio: ^5.7.0
          file_picker: ^8.1.4
          path_provider: ^2.1.5

        dev_dependencies:
          flutter_test:
            sdk: flutter
          flutter_lints: ^4.0.0

        flutter:
          uses-material-design: true
        EOF

    # 4. Injeksi main.dart SETELAH flutter create selesai
    - name: Inject Valid main.dart
      run: |
        mkdir -p lib
        cat << 'EOF' > lib/main.dart
        import 'dart:io';
        import 'package:flutter/material.dart';
        import 'package:path_provider/path_provider.dart';
        import 'package:dio/dio.dart';
        import 'package:file_picker/file_picker.dart';
        import 'package:fllama/fllama.dart';

        void main() {
          runApp(const MyApp());
        }

        class MyApp extends StatelessWidget {
          const MyApp({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'AI Temen Olahraga++',
              theme: ThemeData(
                colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepOrange),
                useMaterial3: true,
              ),
              home: const ChatScreen(),
              debugShowCheckedModeBanner: false,
            );
          }
        }

        class Message {
          final String sender;
          final String text;
          Message({required this.sender, required this.text});
        }

        class ChatScreen extends StatefulWidget {
          const ChatScreen({super.key});

          @override
          State<ChatScreen> createState() => _ChatScreenState();
        }

        class _ChatScreenState extends State<ChatScreen> {
          final TextEditingController _controller = TextEditingController();
          final List<Message> _messages = [];
          
          String selectedModel = 'Qwen2.5 0.5B';
          String? localModelPath;
          bool isDownloading = false;
          double downloadProgress = 0.0;
          bool isModelReady = false;

          final Map<String, String> modelUrls = {
            'Qwen2.5 0.5B': 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf',
          };

          @override
          void initState() {
            super.initState();
            _checkModelExistence();
          }

          Future<void> _checkModelExistence() async {
            final dir = await getApplicationDocumentsDirectory();
            final filePath = '${dir.path}/model.gguf';
            final file = File(filePath);
            if (file.existsSync()) {
              setState(() {
                isModelReady = true;
                localModelPath = filePath;
              });
            }
          }

          Future<void> _pickLocalModel() async {
            FilePickerResult? result = await FilePicker.platform.pickFiles(
              type: FileType.any,
            );

            if (result != null && result.files.single.path != null) {
              String path = result.files.single.path!;
              if (path.endsWith('.gguf')) {
                setState(() {
                  localModelPath = path;
                  isModelReady = true;
                });
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Model Terpilih: ${result.files.single.name}')),
                  );
                }
              } else {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Pilih file berformat .gguf!')),
                  );
                }
              }
            }
          }

          Future<void> _downloadModel() async {
            setState(() {
              isDownloading = true;
              downloadProgress = 0.0;
            });

            try {
              final dir = await getApplicationDocumentsDirectory();
              final filePath = '${dir.path}/model.gguf';
              final url = modelUrls[selectedModel]!;

              Dio dio = Dio();
              await dio.download(url, filePath, onReceiveProgress: (received, total) {
                if (total != -1) {
                  setState(() {
                    downloadProgress = received / total;
                  });
                }
              });

              setState(() {
                isDownloading = false;
                isModelReady = true;
                localModelPath = filePath;
              });
              
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Model AI Berhasil Diunduh!')),
                );
              }
            } catch (e) {
              setState(() {
                isDownloading = false;
              });
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Gagal unduh model: $e')),
                );
              }
            }
          }

          void _sendMessage() async {
            if (_controller.text.trim().isEmpty) return;
            if (localModelPath == null) {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('Pilih file model .gguf dulu bro!')),
              );
              return;
            }

            final userText = _controller.text;
            setState(() {
              _messages.add(Message(sender: 'user', text: userText));
              _controller.clear();
              _messages.add(Message(sender: 'ai', text: 'Sedang berpikir... 🧠'));
            });

            try {
              final req = OpenAiRequest(
                modelPath: localModelPath!,
                messages: [
                  MessageOpenAi(
                    role: "system",
                    content: "Kamu adalah teman olahraga yang asik, ramah, dan memotivasi. Jawab singkat dan santai.",
                  ),
                  MessageOpenAi(
                    role: "user",
                    content: userText,
                  ),
                ],
                contextSize: 2048,
              );

              String aiResponse = "";
              
              await fllamaInference(req, (response, done) {
                aiResponse += response.toString();
                setState(() {
                  _messages[_messages.length - 1] = Message(sender: 'ai', text: aiResponse);
                });
              });
            } catch (e) {
              setState(() {
                _messages[_messages.length - 1] = Message(
                  sender: 'ai',
                  text: 'Gagal memproses AI: $e',
                );
              });
            }
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('AI Temen Olahraga++'),
                backgroundColor: Theme.of(context).colorScheme.inversePrimary,
              ),
              body: Column(
                children: [
                  Card(
                    margin: const EdgeInsets.all(8.0),
                    child: Padding(
                      padding: const EdgeInsets.all(12.0),
                      child: Column(
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Expanded(
                                child: Text(
                                  isModelReady ? 'Model: ${localModelPath?.split('/').last}' : selectedModel,
                                  style: const TextStyle(fontWeight: FontWeight.bold),
                                  overflow: TextOverflow.ellipsis,
                                ),
                              ),
                              if (isModelReady)
                                const Chip(label: Text('Siap'), backgroundColor: Colors.greenAccent)
                            ],
                          ),
                          const SizedBox(height: 8),
                          Row(
                            children: [
                              Expanded(
                                child: OutlinedButton.icon(
                                  onPressed: _pickLocalModel,
                                  icon: const Icon(Icons.folder_open),
                                  label: const Text('Pilih File HP'),
                                ),
                              ),
                              const SizedBox(width: 8),
                              Expanded(
                                child: ElevatedButton.icon(
                                  onPressed: isDownloading ? null : _downloadModel,
                                  icon: const Icon(Icons.download),
                                  label: const Text('Download'),
                                ),
                              ),
                            ],
                          ),
                          if (isDownloading) ...[
                            const SizedBox(height: 10),
                            LinearProgressIndicator(value: downloadProgress),
                            const SizedBox(height: 4),
                            Text('${(downloadProgress * 100).toStringAsFixed(1)}%'),
                          ]
                        ],
                      ),
                    ),
                  ),

                  Expanded(
                    child: _messages.isEmpty
                        ? const Center(child: Text('Belum ada percakapan. Mulai sapa teman workout-mu!'))
                        : ListView.builder(
                            padding: const EdgeInsets.all(8.0),
                            itemCount: _messages.length,
                            itemBuilder: (context, index) {
                              final msg = _messages[index];
                              final isUser = msg.sender == 'user';
                              return Align(
                                alignment: isUser ? Alignment.centerRight : Alignment.centerLeft,
                                child: Container(
                                  margin: const EdgeInsets.symmetric(vertical: 4.0),
                                  padding: const EdgeInsets.all(12.0),
                                  decoration: BoxDecoration(
                                    color: isUser ? Colors.deepOrange[100] : Colors.grey[300],
                                    borderRadius: BorderRadius.circular(12),
                                  ),
                                  child: Text(msg.text, style: const TextStyle(fontSize: 16)),
                                ),
                              );
                            },
                          ),
                  ),

                  Padding(
                    padding: const EdgeInsets.all(8.0),
                    child: Row(
                      children: [
                        Expanded(
                          child: TextField(
                            controller: _controller,
                            decoration: const InputDecoration(
                              hintText: 'Tanyakan sesuatu tentang olahraga...',
                              border: OutlineInputBorder(),
                            ),
                          ),
                        ),
                        const SizedBox(width: 8),
                        IconButton(
                          icon: const Icon(Icons.send, color: Colors.deepOrange),
                          onPressed: _sendMessage,
                        ),
                      ],
                    ),
                  ),
                ],
              ),
            );
          }
        }
        EOF

    # 5. Install CMake 3.22.1 & NDK 28
    - name: Install Android CMake & NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;28.0.12433566" || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    # 6. Patch Android SDK 35, NDK 28 & Kotlin 2.1.0
    - name: Patch Android Config
      run: |
        sed -i 's/compileSdkVersion .*/compileSdk = 35/g' android/app/build.gradle
        sed -i 's/targetSdkVersion .*/targetSdk = 35/g' android/app/build.gradle
        sed -i 's/compileSdk .*/compileSdk = 35/g' android/app/build.gradle
        sed -i 's/targetSdk .*/targetSdk = 35/g' android/app/build.gradle
        sed -i '/android {/a \    ndkVersion = "28.0.12433566"' android/app/build.gradle
        sed -i 's/gradle-.*-all.zip/gradle-8.4-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

        cat << 'EOF' > android/settings.gradle
        pluginManagement {
            def flutterSdkPath = {
                def properties = new Properties()
                def propertiesFile = new File(settingsDir, 'local.properties')
                if (propertiesFile.exists()) {
                    propertiesFile.withReader('UTF-8') { reader -> properties.load(reader) }
                }
                def flutterSdkPath = properties.getProperty('flutter.sdk')
                assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                return flutterSdkPath
            }()

            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        plugins {
            id "dev.flutter.flutter-plugin-loader" version "1.0.0"
            id "com.android.application" version "8.3.2" apply false
            id "org.jetbrains.kotlin.android" version "2.1.0" apply false
        }

        include ":app"
        EOF

    # 7. Install Dependencies
    - name: Install Dependencies
      run: flutter pub get

    # 8. Build APK Release
    - name: Build Android APK
      run: flutter build apk --release --target-platform android-arm64

    # 9. Upload Release APK
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Olahraga-App
        path: build/app/outputs/flutter-apk/app-release.apk