name: Build Flutter On-Device AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'
        channel: 'stable'

    - name: Install Android CMake, NDK & Accept Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;28.0.12433566" || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Patch Android SDK 35 & NDK 28
      run: |
        sed -i 's/compileSdkVersion .*/compileSdk = 35/g' android/app/build.gradle
        sed -i 's/targetSdkVersion .*/targetSdk = 35/g' android/app/build.gradle
        sed -i 's/compileSdk .*/compileSdk = 35/g' android/app/build.gradle
        sed -i 's/targetSdk .*/targetSdk = 35/g' android/app/build.gradle
        sed -i '/android {/a \    ndkVersion = "28.0.12433566"' android/app/build.gradle

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Android APK
      run: flutter build apk --release --target-platform android-arm64

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Olahraga-App
        path: build/app/outputs/flutter-apk/app-release.apk